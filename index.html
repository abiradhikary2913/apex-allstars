<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>APEX ALL STARS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #070a0f;
      color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 30px 15px;
    }

    /* Fixed Corner Logo */
    .corner-logo {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 70px;
      height: 70px;
      object-fit: contain;
      z-index: 50;
    }

    /* Background Watermark */
    .bg-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 550px);
      height: min(80vw, 550px);
      background: url('logo.png.jpeg') no-repeat center center;
      background-size: contain;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: rgba(12, 17, 28, 0.95);
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .brand-title {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffd700;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .brand-sub {
      text-align: center;
      color: #8fa0b5;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* Search Box */
    .search-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      background: #060910;
      border: 1px solid #3a4b63;
      border-radius: 8px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .search-input:focus {
      border-color: #ffd700;
    }

    .search-btn {
      background: #ffd700;
      color: #070a0f;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .search-btn:hover {
      background: #e6c200;
    }

    /* Error Message */
    .error-msg {
      display: none;
      color: #ff5252;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid #ff5252;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* Details Card */
    .result-card {
      display: none;
      background: #080d16;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
      padding: 20px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202b3d;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .player-name {
      font-size: 20px;
      font-weight: 700;
      color: #ffd700;
    }

    .status-badge {
      background: rgba(46, 213, 115, 0.15);
      border: 1px solid #2ed573;
      color: #2ed573;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .info-item {
      background: #111827;
      padding: 10px 12px;
      border-radius: 6px;
    }

    .info-label {
      font-size: 11px;
      color: #8fa0b5;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-val {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    /* Enrollment Column */
    .enroll-section {
      border-top: 1px solid #202b3d;
      padding-top: 15px;
    }

    .enroll-header {
      font-size: 12px;
      font-weight: 700;
      color: #ffd700;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .enroll-header span {
      font-size: 11px;
      color: #8fa0b5;
      text-transform: none;
      font-weight: normal;
    }

    .champ-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .champ-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #1f2937;
    }

    .champ-name {
      font-size: 13px;
      font-weight: 600;
      color: #f0f4f8;
      cursor: pointer;
      text-decoration: underline;
    }

    .champ-name:hover {
      color: #ffd700;
    }

    .enroll-btn {
      background: transparent;
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .enroll-btn.enrolled {
      background: #2ed573;
      border-color: #2ed573;
      color: #070a0f;
    }

    /* Modal / Popup */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-content {
      background: #0e1522;
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
    }

    .modal-title {
      font-size: 16px;
      color: #ffd700;
      margin-bottom: 12px;
      border-bottom: 1px solid #202b3d;
      padding-bottom: 6px;
    }

    .participants-list {
      list-style: none;
      margin-bottom: 16px;
      max-height: 160px;
      overflow-y: auto;
    }

    .participants-list li {
      padding: 8px 10px;
      background: #151e2e;
      margin-bottom: 6px;
      border-radius: 4px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }

    .close-modal-btn {
      background: #ffd700;
      color: #070a0f;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-weight: 700;
      font-size: 13px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Corner Logo -->
  <img src="logo.png.jpeg" alt="Logo" class="corner-logo">

  <!-- Background Watermark -->
  <div class="bg-watermark"></div>

  <!-- Main Box -->
  <div class="container">
    <div class="brand-title">APEX ALL STARS</div>
    <div class="brand-sub">Official Member & Championship Directory</div>

    <!-- Search Bar -->
    <div class="search-group">
      <input 
        type="text" 
        id="nameInput" 
        class="search-input" 
        placeholder="Enter name (Abir, Nil, Shruti, Kutush, Manoj)..." 
      />
      <button class="search-btn" id="searchBtn" type="button">Search</button>
    </div>

    <!-- Error Box -->
    <div id="errorMsg" class="error-msg">Member not found. Check the name spelling.</div>

    <!-- Member Details & Enrollment -->
    <div id="resultCard" class="result-card">
      <div class="player-header">
        <span class="player-name" id="resName"></span>
        <span class="status-badge" id="resStatus">Active Member</span>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Primary Sport</div>
          <div class="info-val" id="resSport"></div>
        </div>
        <div class="info-item">
          <div class="info-label">Speciality</div>
          <div class="info-val" id="resSpecialty"></div>
        </div>
      </div>

      <!-- Enrollment Column -->
      <div class="enroll-section">
        <div class="enroll-header">
          Championship Enrollment
          <span>(Click sport name to view roster)</span>
        </div>

        <div class="champ-list">
          <div class="champ-item">
            <span class="champ-name" id="view-Football">Football Championship</span>
            <button class="enroll-btn" id="btn-Football" type="button">Enroll</button>
          </div>
          <div class="champ-item">
            <span class="champ-name" id="view-Cricket">Cricket Championship</span>
            <button class="enroll-btn" id="btn-Cricket" type="button">Enroll</button>
          </div>
          <div class="champ-item">
            <span class="champ-name" id="view-Marathon">Marathon</span>
            <button class="enroll-btn" id="btn-Marathon" type="button">Enroll</button>
          </div>
          <div class="champ-item">
            <span class="champ-name" id="view-Basketball">Basketball Championship</span>
            <button class="enroll-btn" id="btn-Basketball" type="button">Enroll</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Participants View Popup -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Participants</div>
      <ul class="participants-list" id="modalList"></ul>
      <button class="close-modal-btn" id="closeModalBtn" type="button">Close</button>
    </div>
  </div>

  <script>
    var members = {
      "abir": {
        name: "Abir Adhikary",
        sport: "Multi-sport",
        status: "Active Member",
        specialty: "Tactical Playmaker & Strategic Leader"
      },
      "nil": {
        name: "Nil Adhikary",
        sport: "Cricket / Running",
        status: "Active Member",
        specialty: "High Endurance & Swift Running"
      },
      "shruti": {
        name: "Shruti Adhikary",
        sport: "Running / Cricket",
        status: "Active Member",
        specialty: "Rapid Sprint & Accurate Fielding"
      },
      "kutush": {
        name: "Kutush Adhikary",
        sport: "Cricket",
        status: "Active Member",
        specialty: "Precision Striking & Batting Focus"
      },
      "manoj": {
        name: "Manoj Adhikary",
        sport: "Football / Cricket",
        status: "Active Member",
        specialty: "Power Kicks & Solid Defense"
      }
    };

    var enrollments = {
      "Football Championship": [],
      "Cricket Championship": [],
      "Marathon": [],
      "Basketball Championship": []
    };

    try {
      var saved = localStorage.getItem("apex_allstars_data");
      if (saved) {
        enrollments = JSON.parse(saved);
      }
    } catch (err) {}

    var activeMemberKey = null;

    function searchMember() {
      var input = document.getElementById("nameInput").value.trim().toLowerCase();
      var errorMsg = document.getElementById("errorMsg");
      var resultCard = document.getElementById("resultCard");

      if (!input) return;

      var foundKey = null;
      for (var key in members) {
        if (input.indexOf(key) !== -1) {
          foundKey = key;
          break;
        }
      }

      if (foundKey) {
        activeMemberKey = foundKey;
        var data = members[foundKey];

        document.getElementById("resName").textContent = data.name;
        document.getElementById("resStatus").textContent = data.status;
        document.getElementById("resSport").textContent = data.sport;
        document.getElementById("resSpecialty").textContent = data.specialty;

        updateButtons();

        errorMsg.style.display = "none";
        resultCard.style.display = "block";
      } else {
        activeMemberKey = null;
        resultCard.style.display = "none";
        errorMsg.style.display = "block";
      }
    }

    function updateButtons() {
      if (!activeMemberKey) return;
      var memberName = members[activeMemberKey].name;

      var btnMap = {
        "btn-Football": "Football Championship",
        "btn-Cricket": "Cricket Championship",
        "btn-Marathon": "Marathon",
        "btn-Basketball": "Basketball Championship"
      };

      for (var btnId in btnMap) {
        var sport = btnMap[btnId];
        var btn = document.getElementById(btnId);
        if (enrollments[sport] && enrollments[sport].indexOf(memberName) !== -1) {
          btn.textContent = "Enrolled";
          btn.className = "enroll-btn enrolled";
        } else {
          btn.textContent = "Enroll";
          btn.className = "enroll-btn";
        }
      }
    }

    function toggleEnroll(sport) {
      if (!activeMemberKey) return;
      var memberName = members[activeMemberKey].name;

      if (!enrollments[sport]) {
        enrollments[sport] = [];
      }

      var idx = enrollments[sport].indexOf(memberName);
      if (idx > -1) {
        enrollments[sport].splice(idx, 1);
      } else {
        enrollments[sport].push(memberName);
      }

      try {
        localStorage.setItem("apex_allstars_data", JSON.stringify(enrollments));
      } catch (err) {}

      updateButtons();
    }

    function viewRoster(sport) {
      var modal = document.getElementById("modalOverlay");
      var title = document.getElementById("modalTitle");
      var list = document.getElementById("modalList");

      title.textContent = sport + " - Enrolled Members";
      list.innerHTML = "";

      var enrolled = enrollments[sport] || [];
      if (enrolled.length === 0) {
        list.innerHTML = '<li style="color: #8fa0b5; justify-content: center;">No members enrolled yet.</li>';
      } else {
        for (var i = 0; i < enrolled.length; i++) {
          list.innerHTML += '<li><span>' + (i + 1) + '. ' + enrolled[i] + '</span> <span style="color: #ffd700;">Enrolled</span></li>';
        }
      }

      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    // Event Listeners
    document.getElementById("searchBtn").onclick = searchMember;
    document.getElementById("nameInput").onkeypress = function(e) {
      if (e.key === "Enter") {
        searchMember();
      }
    };

    document.getElementById("btn-Football").onclick = function() { toggleEnroll("Football Championship"); };
    document.getElementById("btn-Cricket").onclick = function() { toggleEnroll("Cricket Championship"); };
    document.getElementById("btn-Marathon").onclick = function() { toggleEnroll("Marathon"); };
    document.getElementById("btn-Basketball").onclick = function() { toggleEnroll("Basketball Championship"); };

    document.getElementById("view-Football").onclick = function() { viewRoster("Football Championship"); };
    document.getElementById("view-Cricket").onclick = function() { viewRoster("Cricket Championship"); };
    document.getElementById("view-Marathon").onclick = function() { viewRoster("Marathon"); };
    document.getElementById("view-Basketball").onclick = function() { viewRoster("Basketball Championship"); };

    document.getElementById("closeModalBtn").onclick = closeModal;
  </script>
</body>
</html>
